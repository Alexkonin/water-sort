<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Игры</title>
<meta name="theme-color" content="#102f2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Игры">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css?v=58">
<style>
  #app{justify-content:center;gap:18px;max-width:520px;margin:0 auto;width:100%;touch-action:pan-y}
  .menu-head{text-align:center;flex:0 0 auto}
  .menu-head h1{margin:0;font-size:29px;font-weight:800;letter-spacing:.3px}
  .menu-head p{margin:6px 0 0;font-size:14px;opacity:.8}

  .games{
    flex:0 1 auto;display:flex;flex-direction:column;gap:12px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px;
  }
  /* Карточка игры — ссылка, а не кнопка на JS: работает до загрузки скрипта,
     открывается долгим тапом в новой вкладке и переживает любой сбой в JS. */
  .game{
    display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--ink);
    padding:16px;border-radius:22px;cursor:pointer;
    background:linear-gradient(160deg,#faf6e7,#e9e4cd);
    box-shadow:0 10px 26px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .14s, box-shadow .2s;
  }
  .game:active{transform:scale(.975);box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .game .ico{
    flex:0 0 auto;width:60px;height:60px;border-radius:19px;
    display:flex;align-items:center;justify-content:center;font-size:31px;
    background:#dce3c8;border:1px solid rgba(105,124,72,.2);
  }
  .game .ico .ui-icon{width:34px;height:34px;stroke-width:1.6}
  .game .ico.lights{color:#8b7032}
  .game .ico.flask{color:#3c7568}
  .game .ico.castle{color:#6d7d46}
  .game .arr{display:flex;align-items:center}
  .game .txt{flex:1 1 auto;min-width:0}
  .game .nm{font-size:17px;font-weight:800;letter-spacing:.2px}
  .game .ds{font-size:12.5px;opacity:.85;margin-top:3px;line-height:1.35}
  .game .pr{font-size:12px;font-weight:700;margin-top:7px;color:#647343}
  .game .pr.none{color:#68715b;font-weight:600}
  .game .arr{flex:0 0 auto;font-size:19px;opacity:.35}

  .soon{opacity:.45;pointer-events:none}
  .soon .pr{color:#68715b}

  footer{flex:0 0 auto;text-align:center;font-size:11.5px;opacity:.7;padding-top:2px}
</style>
<link rel="stylesheet" href="palette.css?v=50">
<script src="launch-history.js?v=60"></script>
</head>
<body>
<div id="app">
  <div class="menu-head">
    <h1>Игры</h1>
    <p>Выбери, во что играть</p>
  </div>

  <div class="games" id="games"></div>

  <footer>Работает офлайн · прогресс хранится на этом устройстве</footer>
</div>

<script>
/* ============ список игр ============
   Одна запись на игру в порядке по умолчанию. Для новой игры нужно добавить объект:
   меню, service worker и README ссылаются на этот список, а не на вёрстку.
   progress() читает сохранение самой игры (один и тот же origin, поэтому
   localStorage общий) и возвращает строку под названием — или null, если
   в игру ещё не заходили. Читаем в try/catch: в приватном режиме Safari
   обращение к localStorage может бросить, и меню не должно из-за этого пропасть. */
const GAMES = [
  {
    file: 'tower-defense.html',
    icon: 'castle',
    name: 'Защита башни',
    desc: 'Ставь башни вдоль дороги и не пускай врагов к базе',
    progress(){
      const d = read('towerdef.v1');
      if (!d || !d.stars) return null;
      const lv = Object.keys(d.stars).length;
      if (!lv) return null;
      const st = Object.values(d.stars).reduce((a, b) => a + b, 0);
      return lv + ' ' + plural(lv, 'уровень', 'уровня', 'уровней') + ' · ' + st + '★';
    }
  },
  {
    file: 'water-sort.html',
    icon: 'flask',
    name: 'Разлей по цветам',
    desc: 'Головоломка: разлей жидкость так, чтобы в каждой пробирке остался один цвет',
    progress(){
      const d = read('watersort.v1');
      return d && d.level > 1 ? 'уровень ' + d.level : null;
    }
  },
  {
    file: 'arrow-escape.html',
    icon: 'arrows',
    name: 'Распутай стрелки',
    desc: 'Освобождай пути и выпускай изогнутые стрелки с поля — 100 лесных узоров',
    progress(){
      const d = read('arrowescape.v1');
      if (!d) return null;
      const count = d.best && typeof d.best === 'object' ? Object.keys(d.best).length : 0;
      return count ? 'пройдено ' + count + ' из 100' : 'уровень ' + (d.level || 1) + ' из 100';
    }
  },
  {
    file: 'forest-lights.html',
    icon: 'lights',
    name: 'Собери огоньки',
    desc: 'Вращай кольцо и меняй огоньки тройками, чтобы каждый вернулся на своё место',
    progress(){
      const d = read('forestlights.v1');
      if (!d) return null;
      const cleared = d.completed || d.best;
      const count = cleared && typeof cleared === 'object' ? Object.keys(cleared).length : 0;
      return count ? 'пройдено ' + count + ' из 1000' : 'уровень ' + (d.level || 1) + ' из 1000';
    }
  },
  {
    file: 'mahjong.html',
    icon: 'mahjong',
    name: 'Mahjong',
    desc: 'Находи пары свободных плиток и разбирай многослойные раскладки',
    progress(){
      const d = read('mahjong.v1');
      if (!d) return null;
      const count = Array.isArray(d.completed) ? new Set(d.completed.filter(n => Number.isInteger(n) && n >= 1 && n <= 1000)).size : 0;
      return count ? 'пройдено ' + count + ' из 1000' : 'уровень ' + (d.level || 1) + ' из 1000';
    }
  }
];

function read(key){
  try { return JSON.parse(localStorage.getItem(key) || 'null'); }
  catch { return null; }
}
const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
};

const box = document.getElementById('games');
function renderGames(){
box.replaceChildren();
for (const g of (globalThis.GameLaunches ? globalThis.GameLaunches.rank(GAMES) : GAMES)){
  let pr = null;
  try { pr = g.progress(); } catch { pr = null; }
  const a = document.createElement('a');
  a.className = 'game' + (g.soon ? ' soon' : '');
  a.href = g.soon ? '#' : g.file;
  a.innerHTML =
    '<div class="ico"></div>' +
    '<div class="txt"><div class="nm"></div><div class="ds"></div>' +
    '<div class="pr ' + (pr ? '' : 'none') + '"></div></div>' +
    '<div class="arr"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="icons.svg?v=63#chevron"/></svg></div>';
  a.querySelector('.ico').innerHTML = '<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="icons.svg?v=63#' + g.icon + '"/></svg>';
  a.querySelector('.ico').classList.add(g.icon);
  a.querySelector('.nm').textContent = g.name;
  a.querySelector('.ds').textContent = g.desc;
  a.querySelector('.pr').textContent = g.soon ? 'скоро' : (pr || 'ещё не играл');
  box.appendChild(a);
}
}
renderGames();
addEventListener('pageshow', e => { if (e.persisted) renderGames(); });

if ('serviceWorker' in navigator)
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
</script>
</body>
</html>
