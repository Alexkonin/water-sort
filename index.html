<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Лукоморье</title>
<meta name="theme-color" content="#102f2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Лукоморье">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=lukomorye2">
<link rel="icon" href="favicon.ico?v=lukomorye2">
<link rel="stylesheet" href="shell.css?v=58">
<style>
  html,body{height:auto;min-height:100%;overflow:auto;overscroll-behavior-y:auto}
  #app{height:auto;min-height:100dvh;gap:22px;max-width:850px;margin:0 auto;width:100%;padding:calc(env(safe-area-inset-top) + 26px) 16px calc(env(safe-area-inset-bottom) + 18px);touch-action:pan-y}
  .menu-head{text-align:center;flex:0 0 auto}
  .menu-head h1{margin:0;font-size:29px;font-weight:800;letter-spacing:.3px}
  .menu-head p{margin:6px 0 0;font-size:14px;color:var(--muted)}
  .games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;align-content:start}
  .game{display:flex;flex-direction:column;min-width:0;text-decoration:none;color:var(--ink);border-radius:19px;background:#f4efdb;box-shadow:0 5px 16px #061b1926;transition:transform .16s,box-shadow .16s}
  .game:active{transform:scale(.975)}
  .game .scene{aspect-ratio:18/11;overflow:hidden;border-radius:19px 19px 0 0;isolation:isolate}
  .scene svg,.scene canvas{display:block;width:100%;height:100%;pointer-events:none}
  .scene.castle{background:linear-gradient(145deg,#bccb8d,#7c9c67)}
  .scene.flask{background:radial-gradient(ellipse at 50% 70%,#387065,#163e3e)}
  .scene.truck{background:linear-gradient(145deg,#315d58,#173c37)}
  .scene.lights{background:radial-gradient(ellipse,#315950,#142f33)}
  .scene.mahjong{background:linear-gradient(145deg,#b7cbbb,#749b8c)}
  .scene.memory{background:linear-gradient(145deg,#e7d6a9,#bdac7e)}
  .game .txt{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1}
  .game .nm{font-size:16px;font-weight:800;line-height:1.2;margin:0}
  .game .ds{font-size:12px;line-height:1.35;color:#52614e;margin:5px 0 11px;min-height:2.7em}
  .game .meta{display:flex;align-items:center;gap:5px;margin-top:auto}
  .game .pr{font-size:10.5px;line-height:1.35;color:#67715d;font-variant-numeric:tabular-nums}
  .game .arr{display:flex;margin-left:auto;color:#6b785d;flex:0 0 auto}
  .game .arr .ui-icon{width:16px;height:16px}
  .soon{opacity:.45;pointer-events:none}
  footer{text-align:center;font-size:11px;line-height:1.5;color:var(--muted);margin-top:auto}
  @media(hover:hover){.game:hover{transform:translateY(-3px);box-shadow:0 9px 24px #061b1945}}
  @media(min-width:700px){#app{padding-top:40px;gap:28px}.games{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.game .nm{font-size:18px}.game .ds{font-size:13px}.game .txt{padding:14px 16px}.game .pr{font-size:11px}}
  @media(max-width:350px){#app{padding-inline:12px}.games{gap:12px 10px}.game .txt{padding:10px}.game .nm{font-size:15px}}
  @media(prefers-reduced-motion:reduce){.game{transition:none}.game:hover,.game:active{transform:none}}
</style>
<link rel="stylesheet" href="palette.css?v=50">
<script src="launch-history.js?v=61"></script>
<script src="focus-mode.js?v=65"></script>
<link rel="stylesheet" href="ui-theme.css?v=199">
</head>
<body>
<div id="app">
  <div class="menu-head">
    <h1>Лукоморье</h1>
    <p>Выбери, во что играть</p>
  </div>

  <nav class="games" id="games" aria-label="Коллекция игр"></nav>

  <footer>Работает офлайн · прогресс хранится на этом устройстве</footer>
</div>

<script src="arsenal/gun/design/storybook-v04/gun.js?v=194"></script>
<script src="bestiary/ugolek/animations/ugolek.js?v=194"></script>
<script src="sand-trucks-art.js?v=194"></script>
<script src="mahjong-glyphs.js?v=194"></script>
<script src="mahjong-art.js?v=194"></script>
<script src="menu-art.js?v=194"></script>
<script>
/* ============ список игр ============
   Одна запись на игру в порядке по умолчанию. Для новой игры нужно добавить объект:
   меню, service worker и README ссылаются на этот список, а не на вёрстку.
   progress() читает сохранение самой игры (один и тот же origin, поэтому
   localStorage общий) и возвращает строку под названием — или null, если
   в игру ещё не заходили. Читаем в try/catch: в приватном режиме Safari
   обращение к localStorage может бросить, и меню не должно из-за этого пропасть. */
const GAMES = [
  {
    file: 'tower-defense.html',
    icon: 'castle',
    name: 'Защита башни',
    desc: 'Останови лесную армию',
    progress(){
      const d = read('towerdef.v1');
      if (!d || !d.stars) return null;
      const lv = Object.keys(d.stars).length;
      if (!lv) return null;
      const st = Object.values(d.stars).reduce((a, b) => a + b, 0);
      return lv + ' ' + plural(lv, 'уровень', 'уровня', 'уровней') + ' · ' + st + '★';
    }
  },
  {
    file: 'water-sort.html',
    icon: 'flask',
    name: 'Разлей по цветам',
    desc: 'Собери каждый цвет в колбу',
    progress(){
      const d = read('watersort.v1');
      return d && d.level > 1 ? 'уровень ' + d.level : null;
    }
  },
  {
    file: 'sand-trucks.html',
    icon: 'truck',
    name: 'Песочные самосвалы',
    desc: 'Лови цветной песок в кузов',
    progress(){
      const d = read('sandtrucks.v1');
      return d && d.version === 5 ? 'уровень ' + d.level + ' · собрано ' + (Array.isArray(d.completed) ? d.completed.length : 0) + ' из 100' : null;
    }
  },
  {
    file: 'forest-lights.html',
    icon: 'lights',
    name: 'Собери огоньки',
    desc: 'Верни огоньки на свои места',
    progress(){
      const d = read('forestlights.v1');
      if (!d) return null;
      const cleared = d.completed || d.best;
      const count = cleared && typeof cleared === 'object' ? Object.keys(cleared).length : 0;
      return count ? 'пройдено ' + count + ' из 1000' : 'уровень ' + (d.level || 1) + ' из 1000';
    }
  },
  {
    file: 'mahjong.html',
    icon: 'mahjong',
    name: 'Mahjong',
    desc: 'Находи пары, слой за слоем',
    progress(){
      const d = read('mahjong.v1');
      if (!d) return null;
      const count = Array.isArray(d.completed) ? new Set(d.completed.filter(n => Number.isInteger(n) && n >= 1 && n <= 10000)).size : 0;
      return count ? 'пройдено ' + count + ' из 10000' : 'уровень ' + (d.level || 1) + ' из 10000';
    }
  },
  {
    file: 'memory-cards.html',
    icon: 'memory',
    name: 'Лесные карточки',
    desc: 'Запомни, где прячутся находки',
    progress(){
      const d = read('memorycards.v1');
      if (!d) return null;
      const count = d.best && typeof d.best === 'object' ? Object.keys(d.best).length : 0;
      return count ? 'пройдено ' + count + ' из 100' : 'уровень ' + (d.level || 1) + ' из 100';
    }
  }
];

function read(key){
  try { return JSON.parse(localStorage.getItem(key) || 'null'); }
  catch { return null; }
}
const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
};

const box = document.getElementById('games');
function renderGames(){
box.replaceChildren();
for (const g of (globalThis.GameLaunches ? globalThis.GameLaunches.rank(GAMES) : GAMES)){
  let pr = null;
  try { pr = g.progress(); } catch { pr = null; }
  const a = document.createElement('a');
  a.className = 'game' + (g.soon ? ' soon' : '');
  a.href = g.soon ? '#' : g.file;
  a.innerHTML =
    '<div class="scene" aria-hidden="true"></div>' +
    '<div class="txt"><h2 class="nm"></h2><p class="ds"></p>' +
    '<div class="meta"><span class="pr"></span>' +
    '<span class="arr"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="icons.svg?v=63#chevron"/></svg></span></div></div>';
  const scene = a.querySelector('.scene');
  scene.classList.add(g.icon);
  // Art is decorative: a failed renderer must never hide the collection links.
  try { globalThis.MenuArt?.render(scene, g.icon); } catch (error) { console.warn('Menu preview:', g.file, error); }
  a.querySelector('.nm').textContent = g.name;
  a.querySelector('.ds').textContent = g.desc;
  a.querySelector('.pr').textContent = g.soon ? 'скоро' : (pr || 'Начать игру');
  box.appendChild(a);
}
}
renderGames();
addEventListener('pageshow', e => { if (e.persisted) renderGames(); });

if ('serviceWorker' in navigator)
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
</script>
</body>
</html>
