<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Картины из песка</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#173d3c;color:#f1ecd6;font:16px/1.4 system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}header p{color:#b9c9b7;margin:0 0 24px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}button,select,a{font:inherit;color:inherit}button,select{background:#284f48;border:1px solid #789082;border-radius:10px;padding:9px 14px}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:22px}figure{margin:0}canvas{display:block;width:100%;aspect-ratio:388/300;border:3px solid #e4ddba;border-radius:8px}figcaption{margin-top:10px;min-height:48px}figcaption span{color:#b9c9b7;margin-right:8px}footer{margin-top:26px;color:#b9c9b7}a{color:#f4df68}
</style>
<main><header><h1>Картины из песка</h1><p>Солнце, море и маленькие истории — вся коллекция из 100 картин.</p></header>
<nav aria-label="Выбор картин"><button id="prev" aria-label="Предыдущие десять картин">←</button><select id="chapter" aria-label="Десяток картин"></select><button id="next" aria-label="Следующие десять картин">→</button><a href="../../sand-trucks.html">К игре</a></nav>
<section id="gallery" aria-live="polite"></section><footer>Простые формы, выразительные силуэты и цветной песок.</footer></main>
<script src="../../sand-trucks-levels.js"></script><script src="../../sand-trucks-sand.js"></script><script src="../../sand-trucks-surface.js"></script><script src="../../sand-trucks-sand-art.js"></script>
<script>
const select=document.querySelector('#chapter'),gallery=document.querySelector('#gallery'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),colors=['#f5b544','#f4df68','#f1ecd6','#28bfc5','#387fa9','#cd6656'];
for(let i=0;i<10;i++)select.add(new Option(`${i*10+1}–${i*10+10}`,i));
function show(page){select.value=page;prev.disabled=page===0;next.disabled=page===9;gallery.replaceChildren();
 for(let i=page*10;i<page*10+10;i++){
  const level=SandTruckLevels[i],figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=388;canvas.height=300;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',level.title);caption.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span>${level.title}`;figure.append(canvas,caption);gallery.append(figure);
  const rows=level.rows.flatMap(r=>Array(2).fill([...r].map(c=>c.repeat(2)).join(''))),grains=rows.join('').split('').map(Number),art={width:rows[0].length,height:rows.length};SandTruckSandArt.create(canvas,colors).draw(art,grains,SandTruckSand.create(grains.length));
 }
}
select.onchange=()=>show(+select.value);prev.onclick=()=>show(+select.value-1);next.onclick=()=>show(+select.value+1);show(0);
</script></html>
