<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Самосвалы · Towers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#234b43;color:#f2ecd2;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px 24px}small{color:#b9c8aa;letter-spacing:.18em}h1{font:38px Georgia,serif;margin:12px 0 8px}p{color:#c5ceb7;margin:0 0 22px}.fleet{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{border:1px solid #8b9c7655;border-radius:18px;background:#31574a;text-align:center;padding:12px 0}.card svg{display:block;width:100%;height:225px}.card span{font-size:12px;color:#d8dfc5}.detail{display:flex;align-items:center;gap:24px;margin-top:20px;padding:18px 24px;background:#1d3f38;border-radius:18px}.detail svg{width:65%;height:165px}.detail p{margin:8px 0;font-size:14px}.selection{display:none}a{color:#ece5bf}@media(max-width:600px){.fleet{grid-template-columns:repeat(3,1fr)}.card svg{height:190px}.detail{display:block}.detail svg{width:100%}}
</style><main><small>ПЕСОЧНЫЕ САМОСВАЛЫ</small><h1>В стилистике Towers</h1><p>Массивные формы, окрашенный кузов, тёплый металл и мягкий свет.</p><div class="fleet" id="fleet"></div><div class="detail"><svg id="cargo" viewBox="0 0 280 90" aria-label="Пустой, частично и полностью заполненный кузов"></svg><div><strong>Песок в кузове</strong><p>Пустой → наполовину → полный</p><a href="../../sand-trucks.html">Открыть игру →</a></div></div></main>
<script src="../../sand-trucks-art.js?v=2"></script><script>
const ns='http://www.w3.org/2000/svg',names=['Охра','Солнце','Сливочный','Бирюза','Синий','Коралловый'];
function draw(svg,color,len,x,y,angle,load,scale=1){const outer=document.createElementNS(ns,'g');outer.setAttribute('transform',`translate(${x} ${y}) rotate(${angle}) scale(${scale})`);const art=SandTruckArt.create({color,cells:Array(len).fill(0)});SandTruckArt.update(art,angle,load);outer.append(art);svg.append(outer);}
for(let i=0;i<6;i++){const card=document.createElement('div');card.className='card';card.innerHTML=`<svg viewBox="-25 -48 50 104" aria-label="${names[i]} самосвал"></svg><span>${names[i]}</span>`;document.querySelector('#fleet').append(card);draw(card.querySelector('svg'),i,i%2?2:3,0,0,0,0);}
for(let i=0;i<3;i++)draw(document.querySelector('#cargo'),3,3,48+i*92,45,90,i/2);
</script></html>
