<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183d38"><title>Песочные самосвалы</title>
<link rel="icon" href="favicon.ico"><link rel="stylesheet" href="shell.css?v=58"><link rel="stylesheet" href="palette.css?v=51"><link rel="stylesheet" href="sand-trucks.css?v=12"><script src="launch-history.js?v=61"></script>
</head><body>
<div id="app">
<header><div class="hdr-side"><a class="icon-btn" href="index.html" aria-label="Все игры">‹</a><button class="icon-btn" id="sound" aria-label="Выключить звук" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="icons.svg?v=63#sound"/></svg></button></div><button id="level" class="hdr-title" aria-label="Выбрать уровень">Уровень 1 ▾</button><div class="hdr-side right"><button id="restart" class="icon-btn" aria-label="Начать уровень заново">↻</button></div></header>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<main aria-label="Песочная картина, нижняя дорога и парковка"><svg id="scene" viewBox="10 0 400 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Самосвалы и песочная картина"></svg></main>
</div>
<dialog id="jamDialog" aria-labelledby="jamTitle"><span class="eyebrow">НЕТ СВОБОДНЫХ МЕСТ</span><h2 id="jamTitle">Нужен другой цвет</h2><p id="jamText"></p><button class="cta" id="jamExtra">Добавить место для машины</button><button class="ghost" id="jamUndo">Вернуть последнюю машину</button><button class="ghost" id="jamRestart">Начать заново</button></dialog>
<dialog id="winDialog" aria-labelledby="winTitle"><span class="eyebrow">ВЕСЬ ПЕСОК СОБРАН</span><h2 id="winTitle">Картина собрана!</h2><canvas id="finishedArt" aria-label="Собранная картина"></canvas><p id="winText"></p><button class="cta" id="next">Следующая картина →</button><button class="ghost" id="again">Собрать ещё раз</button></dialog>
<dialog id="levelsDialog" aria-labelledby="levelsTitle"><button class="close" data-close aria-label="Закрыть уровни">×</button><h2 id="levelsTitle">Картины</h2><nav class="level-pages" aria-label="Страницы уровней"><button id="levelsPrev" aria-label="Предыдущие 10 уровней">‹</button><span id="levelsRange"></span><button id="levelsNext" aria-label="Следующие 10 уровней">›</button></nav><div id="levels" class="levels"></div></dialog>
<script src="sound.js?v=51"></script><script src="arrow-escape.js?v=70"></script><script src="sand-trucks-levels.js?v=8"></script><script src="sand-trucks-sand.js?v=4"></script><script src="sand-trucks.js?v=11"></script><script src="sand-trucks-art.js?v=2"></script><script src="sand-trucks-surface.js?v=1"></script><script src="sand-trucks-sand-art.js?v=6"></script><script src="sand-trucks-audio.js?v=3"></script><script src="sand-trucks-ui.js?v=18"></script>
</body></html>
